[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-infra"
version = "0.2.0"
description = "模块化、AI 友好的 FastAPI 基础设施包"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "AIMidPlatform Team" }
]
keywords = ["fastapi", "infrastructure", "microservices", "async", "database", "cache", "logging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.117.1,<0.118.0",
    "uvicorn[standard]>=0.37.0,<0.38.0",
    "starlette>=0.48.0,<0.49.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "loguru>=0.7.0,<0.8.0",
]

[project.optional-dependencies]
mysql = ["aiomysql>=0.2.0,<0.3.0"]
redis = ["redis>=6.4.0,<7.0.0"]
http = [
    "aiohttp>=3.12.0,<4.0.0",
    "httpx>=0.27.0,<0.29.0",
    "orjson>=3.10.0,<4.0.0",
]
ai-openai = ["openai>=1.0.0"]
ai-anthropic = ["anthropic>=0.40.0"]
ai-gemini = ["google-genai>=1.0.0"]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
]
live-providers = [
    "aiomysql>=0.2.0,<0.3.0",
    "redis>=6.4.0,<7.0.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
]
tasks-redis = ["redis>=6.4.0,<7.0.0"]
tasks-sqs = ["boto3>=1.34.0"]
tasks-kafka = ["aiokafka>=0.10.0"]
tasks-celery = ["celery>=5.3.0"]
observability = [
    "prometheus-client>=0.19.0,<0.20.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "psutil>=7.1.0,<8.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "anyio>=4.0.0",
    "httpx>=0.27.0,<0.29.0",
    "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/Oreo992/fastapi-infra"
Documentation = "https://github.com/Oreo992/fastapi-infra/blob/main/README.md"
Repository = "https://github.com/Oreo992/fastapi-infra"
Issues = "https://github.com/Oreo992/fastapi-infra/issues"

[project.scripts]
fastapi-infra = "infra.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["infra*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: opt-in live provider tests skipped unless required credentials are set",
]
